<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 { margin: 0; }

    .cart {
      background: white;
      color: #111;
      border: 0;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: white;
    }

    .hero h1 { margin: 0 0 10px; }

    .search {
      margin-top: 20px;
      padding: 12px;
      width: min(400px, 90%);
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .products {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 { margin-bottom: 5px; }

    .price {
      font-weight: bold;
      margin: 10px 0;
    }

    .add {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .add:hover { background: #333; }

    #cart {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 300px;
      max-width: calc(100% - 40px);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 25px #0003;
      display: none;
    }

    #cart h3 { margin-top: 0; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .checkout {
      width: 100%;
      padding: 11px;
      background: #16a34a;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h2>MiniShop</h2>
  <button class="cart" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Simple Shopping</h1>
  <p>Find your favorite products.</p>
  <input
    class="search"
    id="search"
    placeholder="Search products..."
    oninput="renderProducts()"
  >
</section>

<main class="products" id="products"></main>

<div id="cart">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <hr>
  <strong>Total: $<span id="total">0.00</span></strong>
  <br><br>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>

<script>
  const products = [
    {
      id: 1,
      name: "Classic T-Shirt",
      price: 25,
      image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80"
    },
    {
      id: 2,
      name: "Sneakers",
      price: 60,
      image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
    },
    {
      id: 3,
      name: "Backpack",
      price: 40,
      image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
    },
    {
      id: 4,
      name: "Watch",
      price: 80,
      image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=500&q=80"
    }
  ];

  let cart = [];

  function renderProducts() {
    const query = document.getElementById("search").value.toLowerCase();

    document.getElementById("products").innerHTML =
      products
        .filter(p => p.name.toLowerCase().includes(query))
        .map(p => `
          <div class="product">
            <img src="${p.image}" alt="${p.name}">
            <h3>${p.name}</h3>
            <div class="price">$${p.price.toFixed(2)}</div>
            <button class="add" onclick="addToCart(${p.id})">
              Add to Cart
            </button>
          </div>
        `).join("");
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    cart.push(product);
    updateCart();
  }

  function updateCart() {
    document.getElementById("count").textContent = cart.length;

    document.getElementById("cartItems").innerHTML =
      cart.length
        ? cart.map((item, index) => `
            <div class="cart-item">
              <span>${item.name}</span>
              <span>
                $${item.price}
                <button onclick="removeFromCart(${index})">×</button>
              </span>
            </div>
          `).join("")
        : "<p>Your cart is empty.</p>";

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById("total").textContent = total.toFixed(2);
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    updateCart();
  }

  function toggleCart() {
    const cartBox = document.getElementById("cart");
    cartBox.style.display =
      cartBox.style.display === "block" ? "none" : "block";
  }

  function checkout() {
    if (!cart.length) {
      alert("Your cart is empty.");
      return;
    }

    alert("Order placed successfully!");
    cart = [];
    updateCart();
  }

  renderProducts();
</script>

</body>
</html>
